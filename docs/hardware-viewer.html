<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deimonyag · Hardware Viewer</title>
<style>
  :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color-scheme:dark}
  body{margin:0;background:#0b0d10;color:#f2f4f8}
  header{padding:18px 22px;border-bottom:1px solid #2a2f39;background:#11151a;position:sticky;top:0;z-index:5}
  h1{font-size:20px;margin:0 0 12px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  button{border:1px solid #343b46;background:#181d24;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
  button.active{background:#fff;color:#111}
  main{padding:16px}
  .hint{font-size:13px;color:#aeb6c2;margin:0 0 10px}
  .viewer{height:calc(100vh - 130px);min-height:520px;border:1px solid #2a2f39;border-radius:10px;background:#050607;overflow:hidden;position:relative}
  .svg-stage{width:100%;height:100%;overflow:hidden;cursor:grab;position:relative}
  .svg-stage.dragging{cursor:grabbing}
  .svg-stage img{position:absolute;left:50%;top:50%;max-width:none;max-height:none;transform-origin:center center;user-select:none;-webkit-user-drag:none}
  iframe{width:100%;height:100%;border:0;background:#fff}
  .hidden{display:none}
  .toolbar{position:absolute;right:12px;top:12px;z-index:3;display:flex;gap:6px}
  .toolbar button{padding:6px 9px;background:#111a;color:#fff;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<header>
  <h1>RMP Deimonyag · Hardware Viewer</h1>
  <div class="tabs">
    <button data-view="main" class="active">Esquemático · Main Board</button>
    <button data-view="sensor">Esquemático · 12 Sensor</button>
    <button data-view="top">PCB · Top</button>
    <button data-view="bottom">PCB · Bottom</button>
  </div>
</header>
<main>
  <p class="hint" id="hint">SVG: rueda del mouse para zoom · arrastrar para desplazarse · doble clic para restablecer.</p>
  <section class="viewer">
    <div class="toolbar" id="toolbar"><button id="minus">−</button><button id="reset">100%</button><button id="plus">+</button></div>
    <div id="svg-stage" class="svg-stage">
      <img id="svg-image" alt="Vista del hardware">
    </div>
    <iframe id="pdf-frame" class="hidden" title="PCB PDF"></iframe>
  </section>
</main>
<script>
const files={
 main:'../hardware/previews/SCH_Deimonyag_1-Main_Board_2026-09-12.svg',
 sensor:'../hardware/previews/SCH_Deimonyag_2-12_Sensor_2026-09-12.svg',
 top:'../hardware/previews/PCB_PCB1_2026-09-12_Top.pdf',
 bottom:'../hardware/previews/PCB_PCB1_2026-09-12_Bottom.pdf'
};
const stage=document.getElementById('svg-stage');
const img=document.getElementById('svg-image');
const frame=document.getElementById('pdf-frame');
const toolbar=document.getElementById('toolbar');
const hint=document.getElementById('hint');
let scale=1,x=0,y=0,drag=false,sx=0,sy=0;
function apply(){img.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;document.getElementById('reset').textContent=Math.round(scale*100)+'%'}
function reset(){scale=1;x=0;y=0;apply()}
function show(kind){
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===kind));
 const isPdf=kind==='top'||kind==='bottom';
 if(isPdf){stage.classList.add('hidden');frame.classList.remove('hidden');toolbar.classList.add('hidden');frame.src=files[kind];hint.textContent='PDF vectorial: usá los controles de zoom del visor del navegador.'}
 else{frame.classList.add('hidden');frame.src='';stage.classList.remove('hidden');toolbar.classList.remove('hidden');img.src=files[kind];reset();hint.textContent='SVG: rueda del mouse para zoom · arrastrar para desplazarse · doble clic para restablecer.'}
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
stage.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY<0?1.12:0.89;scale=Math.min(12,Math.max(.2,scale*factor));apply()},{passive:false});
stage.addEventListener('mousedown',e=>{drag=true;stage.classList.add('dragging');sx=e.clientX-x;sy=e.clientY-y});
window.addEventListener('mousemove',e=>{if(!drag)return;x=e.clientX-sx;y=e.clientY-sy;apply()});
window.addEventListener('mouseup',()=>{drag=false;stage.classList.remove('dragging')});
stage.addEventListener('dblclick',reset);
document.getElementById('plus').onclick=()=>{scale=Math.min(12,scale*1.2);apply()};
document.getElementById('minus').onclick=()=>{scale=Math.max(.2,scale/1.2);apply()};
document.getElementById('reset').onclick=reset;
show('main');
</script>
</body>
</html>
